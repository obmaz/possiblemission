<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fa" />
  <title>새 미니게임 | POSSIBLE MISSION</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../styles/shell.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/setup.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body data-game="template">
  <div class="arcade-backdrop" aria-hidden="true"></div>

  <!-- Standalone play page: the shared bar stays collapsed (fullscreen + back to lobby only) -->
  <section id="game-view" class="game-view" data-layout="hidden" aria-label="게임 플레이 화면">
    <header class="game-hud" role="banner">
      <div class="game-hud__actions">
        <button class="hud-btn hud-keep" type="button" data-fullscreen-toggle hidden></button>
        <a class="hud-btn hud-keep" href="../../" aria-label="아케이드 로비로" title="아케이드 로비로">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
    </header>
    <div id="game-stage" class="game-stage"></div>
  </section>

  <div id="modal-root" class="modal-root" hidden></div>
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="../../js/standalone.js"></script>
</body>
</html>
