<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fa" />
  <title>POSSIBLE MISSION | 워크샵 미니게임 아케이드</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/lobby.css" />
  <link rel="stylesheet" href="./styles/shell.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/setup.css" />
  <!-- Each game's own stylesheet (games/<id>/style.css) is added by js/shell/registry.js -->
</head>
<body>
  <div class="arcade-backdrop" aria-hidden="true"></div>

  <!-- Lobby -->
  <main id="lobby-view" class="lobby-view">
    <section id="hero-banner" class="hero-banner" aria-label="워크샵 아케이드 배너"></section>
    <section id="workshop-bar" class="workshop-bar" aria-label="플레이어 및 룸 시드 설정"></section>
    <section id="game-grid" class="game-grid" aria-label="미니게임 선택"></section>
  </main>

  <!-- Game screen: shared top bar + the stage every game mounts into -->
  <section id="game-view" class="game-view" data-layout="shown" hidden aria-label="게임 플레이 화면">
    <header id="game-hud" class="game-hud" role="banner">
      <div class="game-hud__left">
        <button id="hud-exit-btn" class="hud-btn" type="button" aria-label="로비로 나가기" title="로비로 나가기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span class="hud-btn__label game-hud__back-label">로비로</span>
        </button>
        <div class="game-hud__identity">
          <span id="hud-game-title" class="game-hud__title"></span>
          <span id="hud-mode-label" class="game-hud__mode"></span>
          <span id="hud-seed-badge" class="game-hud__seed"></span>
        </div>
      </div>

      <div class="game-hud__actions">
        <button id="hud-fullscreen-btn" class="hud-btn hud-keep" type="button" data-fullscreen-toggle data-with-label hidden></button>
        <button id="hud-layout-btn" class="hud-btn hud-keep" type="button" data-layout-toggle aria-label="공통 레이아웃 가리기" title="공통 레이아웃 가리기 (게임 화면만 크게)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
          <span class="hud-btn__label" data-layout-label>레이아웃 숨기기</span>
        </button>
        <button id="hud-pause-btn" class="hud-btn hud-btn--icon" type="button" aria-label="일시정지" title="일시정지"></button>
        <div class="hud-more">
          <button id="hud-more-btn" class="hud-btn hud-btn--icon" type="button" aria-label="더 보기" title="더 보기" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5.5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18.5" r="2"/></svg>
          </button>
          <div id="hud-menu" class="hud-menu" hidden>
            <button id="hud-restart-btn" class="hud-menu__item" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              <span>다시 시작</span>
            </button>
            <button id="hud-mute-btn" class="hud-menu__item" type="button" data-mute-toggle data-with-label></button>
          </div>
        </div>
      </div>
    </header>

    <div id="game-stage" class="game-stage"></div>
  </section>

  <!-- Shared modal, confetti and toast layers -->
  <div id="modal-root" class="modal-root" hidden></div>
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
